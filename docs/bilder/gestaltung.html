<!doctype html>

<html lang="de">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,SOFT,wght@0,9..144,100,600;1,9..144,100,500&family=Source+Serif+4:wght@400&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .karte { position: relative; width: 1280px; height: 440px; border-radius: 30px; overflow: hidden; background: linear-gradient(100deg, #ffffff 0%, #f6fbf9 60%, #f7f6fc 100%); font-family: Figtree, sans-serif; color: #1c2a22; box-shadow: inset 0 0 0 1px rgba(42,69,54,.12); }
  svg.deko { position: absolute; inset: 0; }
  .kopf { position: absolute; left: 60px; top: 46px; }
  .eyebrow { font-family: "DM Mono", monospace; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #6b7568; }
  h2 { font-family: Fraunces, serif; font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 44px; margin: 6px 0 0; color: #1e3428; letter-spacing: -.02em; }
  h2 em { font-weight: 500; color: #4d7858; }
  .farben { position: absolute; left: 60px; top: 170px; display: flex; gap: 22px; }
  .farbe { width: 112px; text-align: left; }
  .klecks { width: 104px; height: 92px; margin-bottom: 12px; }
  .farbe b { display: block; font-size: 15px; font-weight: 600; }
  .farbe span { font-family: "DM Mono", monospace; font-size: 13px; color: #6b7568; }
  .schriften { position: absolute; right: 60px; top: 60px; width: 330px; display: flex; flex-direction: column; gap: 16px; }
  .schrift { padding: 12px 18px; border-radius: 18px; background: #eef7f2; }
  .schrift small { display: block; font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #6b7568; margin-bottom: 2px; }
  .s1 { font-family: Fraunces, serif; font-variation-settings: "SOFT" 100; font-weight: 600; font-size: 25px; color: #1e3428; }
  .s2 { font-family: Figtree, sans-serif; font-size: 20px; font-weight: 500; }
  .s3 { font-family: "DM Mono", monospace; font-size: 18px; color: #345a43; }
  .s4 { font-family: "Source Serif 4", serif; font-size: 19px; }
</style>
</head>
<body>
<div class="karte">
  <svg class="deko" viewBox="0 0 1280 440" fill="none">
